name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v0.1.0"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Building HatchDroid release for tag: $TAG"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: 'aarch64-linux-android,x86_64-linux-android'

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Locate Android NDK & Setup Toolchain
        run: |
          NDK_DIR=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android NDK at: $NDK_DIR"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android Build Tools at: $BUILD_TOOLS_DIR"
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH

      - name: Build Android Native Libraries (16 KB Aligned)
        run: |
          chmod +x ./scripts/build-android.sh
          ./scripts/build-android.sh --release

      - name: Verify 16 KB ELF Page Alignment
        run: |
          SO_FILE="android-app/app/src/main/jniLibs/arm64-v8a/libhatchzip_android.so"
          echo "Checking ELF alignment for $SO_FILE..."
          readelf -l "$SO_FILE" | grep -E "LOAD|Align"

      - name: Decode Signing Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android-app/app/release-keystore.jks
          echo "KEYSTORE_PATH=release-keystore.jks" >> $GITHUB_ENV

      - name: Grant execute permission for Gradle wrapper
        run: |
          chmod +x android-app/gradlew

      - name: Build Release APK & Bundle
        working-directory: android-app
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'hatchzip123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'hatchzip' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'hatchzip123' }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify 16 KB Zip-Alignment & Signature
        run: |
          RELEASE_APK="android-app/app/build/outputs/apk/release/app-release.apk"
          echo "Verifying 16 KB alignment..."
          zipalign -c -P 16 -v 4 "$RELEASE_APK" | grep -E "lib/.*\.so|Verification successful" || true

          echo "Verifying APK signature..."
          apksigner verify --verbose "$RELEASE_APK"

      - name: Prepare Release Artifacts & Checksums
        id: artifacts
        run: |
          mkdir -p release_dist
          TAG="${{ steps.vars.outputs.TAG }}"

          # Copy and rename APK
          cp android-app/app/build/outputs/apk/release/app-release.apk "release_dist/HatchDroid-${TAG}-arm64-v8a.apk"

          # Copy and rename AAB
          if [ -f "android-app/app/build/outputs/bundle/release/app-release.aab" ]; then
            cp android-app/app/build/outputs/bundle/release/app-release.aab "release_dist/HatchDroid-${TAG}.aab"
          fi

          # Generate SHA256 Checksums
          cd release_dist
          sha256sum HatchDroid-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Extract Release Notes from Changelog
        id: notes
        run: |
          CHANGELOG_FILE="android-app/fastlane/metadata/android/en-US/changelogs/1.txt"
          if [ -f "$CHANGELOG_FILE" ]; then
            echo "CHANGELOG_EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "CHANGELOG_EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: "HatchDroid ${{ steps.vars.outputs.TAG }}"
          body_path: ${{ steps.notes.outputs.CHANGELOG_EXISTS == 'true' && 'android-app/fastlane/metadata/android/en-US/changelogs/1.txt' || '' }}
          generate_release_notes: true
          files: |
            release_dist/HatchDroid-*.apk
            release_dist/HatchDroid-*.aab
            release_dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
