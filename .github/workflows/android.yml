name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'crates/android/**'
      - 'crates/core/**'
      - 'scripts/**'
      - 'Cargo.*'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - 'crates/android/**'
      - 'crates/core/**'
      - 'scripts/**'
      - 'Cargo.*'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Native & APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: 'aarch64-linux-android,x86_64-linux-android'

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Locate Android NDK & Setup Toolchain
        run: |
          NDK_DIR=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android NDK at: $NDK_DIR"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build Android Native Libraries (16 KB Aligned)
        run: |
          chmod +x ./scripts/build-android.sh
          ./scripts/build-android.sh --release

      - name: Verify 16 KB ELF Page Alignment
        run: |
          SO_FILE="android-app/app/src/main/jniLibs/arm64-v8a/libhatchzip_android.so"
          echo "Checking ELF alignment for $SO_FILE..."
          readelf -l "$SO_FILE" | grep -E "LOAD|Align"

      - name: Grant execute permission for Gradle wrapper
        run: |
          chmod +x android-app/gradlew

      - name: Build Android APK
        working-directory: android-app
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: HatchDroid-Debug-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 14
