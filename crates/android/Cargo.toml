[package]
name = "hatchzip-android"
description = "UniFFI bridge exposing hatchzip-core to Android/Kotlin."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]
name = "hatchzip_android"

[dependencies]
hatchzip-core.workspace = true
anyhow.workspace = true
thiserror = "2.0"
uniffi = { version = "0.32", features = ["cli"] }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

[features]
default = []
rar = ["hatchzip-core/rar"]

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }
